<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QUAFU 运行结果</title>
<!-- 参考实现：深浅两色自适应的「仪器面板」风格。自包含、离线可开，不加载任何外部资源；数据由 qf.py page 填进 QUAFU_DATA 占位符（一次运行，或 runs 数组做对比）。风格随便改。 -->
<style>
:root{
  --s1:#5b5bd6;--s2:#e8590c;--s3:#0ca678;
  --bg:#f4f5fb;--surface:#ffffff;--ink:#141726;--ink-2:#454b66;--muted:#7a809c;--line:#e3e6f2;
  --meas:#5b5bd6;--ideal:#9aa0bd;--fit:#5b5bd6;--exact:#d9480f;--cell:#5b5bd6;--glow:rgba(91,91,214,.18);
  --radius:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --s1:#7b7bff;--s2:#e8690f;--s3:#14a37f;
  --bg:#090b16;--surface:#11152a;--ink:#eef0ff;--ink-2:#b9bedb;--muted:#7d84a8;--line:#232947;
  --meas:#8b8bff;--ideal:#5d6489;--fit:#8b8bff;--exact:#ff8a4c;--cell:#8b8bff;--glow:rgba(139,139,255,.22);
}}
:root[data-theme="dark"]{
  --s1:#7b7bff;--s2:#e8690f;--s3:#14a37f;
  --bg:#090b16;--surface:#11152a;--ink:#eef0ff;--ink-2:#b9bedb;--muted:#7d84a8;--line:#232947;
  --meas:#8b8bff;--ideal:#5d6489;--fit:#8b8bff;--exact:#ff8a4c;--cell:#8b8bff;--glow:rgba(139,139,255,.22);
}
*{box-sizing:border-box}
html{background:var(--bg)}body{min-height:100vh}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,var(--glow),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);
  font:16px/1.65 "Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{width:min(1120px,100% - 32px);margin-inline:auto;padding:56px 0 40px}
.head{margin-bottom:28px}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--meas);font-weight:600}
h1{font-size:clamp(28px,4.4vw,46px);line-height:1.15;margin:.3em 0 0;font-weight:700;letter-spacing:-.01em}
h2{font-size:15px;font-weight:600;color:var(--ink-2);margin:0 0 14px}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:16px}
.stat,.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px}
.stat-value{font-size:clamp(34px,5vw,52px);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat-label{margin-top:6px;color:var(--ink-2)}
.stat-sub{font-size:13px;color:var(--muted)}
.panel{margin-bottom:16px}
.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.cols .panel{margin-bottom:0}
.cols{margin-bottom:16px}
@media (max-width:760px){.cols{grid-template-columns:1fr}.wrap{padding-top:32px}}
.summary{margin:0;padding-left:1.2em}
.summary li{margin:.35em 0;color:var(--ink)}
.summary li::marker{color:var(--meas)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:14px}
.meta dt{color:var(--muted)}.meta dd{margin:0;word-break:break-all;font-variant-numeric:tabular-nums}
.chart{width:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-2);margin:-4px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{display:inline-block;width:14px;height:10px;border-radius:3px}
.sw-meas{background:var(--meas)}.sw-ideal{border:1.5px solid var(--ideal)}
.sw-ideal-line{height:0;border-top:2px dashed var(--ideal);border-radius:0}
.sw-fit{height:0;border-top:2px solid var(--fit);border-radius:0}
.sw-exact{height:0;border-top:2px dotted var(--exact);border-radius:0}
.sw-cell{background:var(--cell)}.sw-dot{width:10px;height:10px;border-radius:50%;background:var(--meas)}
svg text{fill:var(--muted);font-size:12px;font-family:inherit}
svg .mono,.mono{font-family:"JetBrains Mono","SFMono-Regular",Consolas,monospace}
.grid{stroke:var(--line);stroke-width:1}.axis{stroke:var(--ideal);stroke-width:1}
.ideal{fill:none;stroke:var(--ideal);stroke-width:1.5}
.meas{fill:var(--meas)}
.hit{fill:transparent}
.line-ideal{fill:none;stroke:var(--ideal);stroke-width:2;stroke-dasharray:6 5}
.line-fit{fill:none;stroke:var(--fit);stroke-width:2}
.line-exact{stroke:var(--exact);stroke-width:2;stroke-dasharray:2 4}
.dot{fill:var(--meas);stroke:var(--surface);stroke-width:2}
.cell{fill:var(--cell)}
.cell-label{fill:var(--ink);font-size:12px;font-variant-numeric:tabular-nums}.cell-label.on-dark{fill:#fff}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500}
.table-scroll{overflow-x:auto}
.raw summary{cursor:pointer;color:var(--ink-2)}
pre{font:13px/1.5 "JetBrains Mono",Consolas,monospace;overflow:auto;margin:12px 0 0;color:var(--ink-2)}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:28px}
.tip{position:fixed;left:0;top:0;pointer-events:none;opacity:0;transition:opacity .12s;background:var(--ink);color:var(--surface);
  padding:8px 12px;border-radius:10px;font-size:13px;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:9}

.s1{fill:var(--s1)}.s2{fill:var(--s2)}.s3{fill:var(--s3)}
.line-s1,.line-s2,.line-s3{fill:none;stroke-width:2}.line-s1{stroke:var(--s1)}.line-s2{stroke:var(--s2)}.line-s3{stroke:var(--s3)}
.dot-s1{fill:var(--s1)}.dot-s2{fill:var(--s2)}.dot-s3{fill:var(--s3)}
.dot-s1,.dot-s2,.dot-s3{stroke:var(--surface);stroke-width:2}
.sw-s1{background:var(--s1)}.sw-s2{background:var(--s2)}.sw-s3{background:var(--s3)}
.c-s1{color:var(--s1)}.c-s2{color:var(--s2)}.c-s3{color:var(--s3)}
</style>
</head>
<body>
<main class="wrap">
  <header class="head">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title">QUAFU 运行结果</h1>
  </header>
  <section class="hero" id="hero"></section>
  <section class="panel">
    <h2 id="chart-title">结果</h2>
    <div class="chart" id="chart"></div>
  </section>
  <section class="panel" hidden>
    <h2 id="chart2-title"></h2>
    <div class="chart" id="chart2"></div>
  </section>
  <section class="cols">
    <div class="panel">
      <h2>这说明了什么</h2>
      <ul class="summary" id="summary"></ul>
    </div>
    <div class="panel">
      <h2>这次运行</h2>
      <dl class="meta" id="meta"></dl>
    </div>
  </section>
  <section class="panel" id="readout" hidden>
    <h2>测量用到的物理比特（当次校准数据）</h2>
    <div class="table-scroll"><table>
      <thead><tr><th>经典位</th><th>物理比特</th><th>0 读对</th><th>1 读对</th><th>T1</th><th>T2</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </section>
  <details class="panel raw">
    <summary>原始计数（第一条线路）</summary>
    <pre id="raw"></pre>
  </details>
  <footer class="foot">由 QUAFU 量子计算云平台运行 · 本页离线可开，不加载任何外部资源</footer>
</main>
<script>window.QUAFU_DATA = /*QUAFU_DATA*/null;</script>
<script>
(function () {
  'use strict';
  var D = window.QUAFU_DATA;
  var $ = function (s) { return document.querySelector(s); };
  var NS = 'http://www.w3.org/2000/svg';
  var pct = function (x, d) { return (100 * x).toFixed(d == null ? 1 : d) + '%'; };
  var css = function (name) { return getComputedStyle(document.body).getPropertyValue(name).trim(); };
  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function h(tag, cls, text, parent) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  if (!D) { $('#title').textContent = '没有数据：用 qf.py page 生成这个页面'; return; }
  var RUNS = D.runs || null;          // 多次运行对比：qf.py page 号1 号2 …
  if (RUNS) D = RUNS[0];

  // ── 提示框 ───────────────────────────────────────────
  var tip = h('div', 'tip', null, document.body);
  function showTip(evt, html) {
    tip.innerHTML = html; tip.style.opacity = 1;
    var x = evt.clientX + 14, y = evt.clientY + 14, r = tip.getBoundingClientRect();
    if (x + r.width > innerWidth - 8) x = evt.clientX - r.width - 14;
    if (y + r.height > innerHeight - 8) y = evt.clientY - r.height - 14;
    tip.style.transform = 'translate(' + x + 'px,' + y + 'px)';
  }
  function hideTip() { tip.style.opacity = 0; }
  function hover(node, html) {
    node.addEventListener('mousemove', function (e) { showTip(e, html); });
    node.addEventListener('mouseleave', hideTip);
    node.style.cursor = 'default';
  }

  if (!RUNS) {
  // ── 头部与大数字 ─────────────────────────────────────
  var real = !/sim/.test(String(D.target));
  $('#title').textContent = D.title || D.template;
  $('#eyebrow').textContent = (real ? '真机 · ' : '模拟器 · ') + (D.backend || D.target);
  var meta = [['任务组', D.job_id], ['目标', D.target], ['每条线路测量次数', D.shots],
              ['提交', (D.submitted_at || '').replace('T', ' ').slice(0, 16)],
              ['完成', (D.finished_at || '').replace('T', ' ').slice(0, 16)]];
  if (D.params && Object.keys(D.params).length) meta.push(['参数', JSON.stringify(D.params)]);
  var dl = $('#meta');
  meta.forEach(function (m) { h('dt', null, m[0], dl); h('dd', null, String(m[1] == null ? '—' : m[1]), dl); });

  var M = D.metrics || {}, hero = $('#hero');
  function heroStat(value, label, sub) {
    var c = h('div', 'stat', null, hero);
    h('div', 'stat-value', value, c); h('div', 'stat-label', label, c);
    if (sub) h('div', 'stat-sub', sub, c);
  }
  if (D.kind === 'rotation') {
    heroStat(M.contrast != null ? M.contrast.toFixed(2) : '—', '对比度', '理想为 1.00');
    heroStat(pct(M.p1_at_0 || 0), 'θ=0 时测到 1', '理想 0%');
    heroStat(pct(M.p1_at_pi || 0), 'θ=π 时测到 1', '理想 100%');
  } else if (D.kind === 'vqe') {
    var f = M.fit || {};
    heroStat(f.min != null ? f.min.toFixed(4) : '—', '拟合最低能量（Ha）', '精确 ' + M.exact.toFixed(4));
    heroStat(f.min != null ? (1000 * (f.min - M.exact)).toFixed(1) : '—', '偏差（毫 Ha）', '化学精度 1.6');
  } else if (D.kind === 'qaoa') {
    var b = M.best || {};
    heroStat(b.cut != null ? b.cut.toFixed(2) : '—', '最好一组角度的平均割值', '随机 2 · 最优 4');
    heroStat(pct(b.p_max || 0), '直接测到最优分法', '0101 或 1010');
  } else {
    heroStat(M.fidelity != null ? M.fidelity.toFixed(3) : '—', '与理想分布的相似度', '1 = 完全一致');
    if (M.good_mass != null) heroStat(pct(M.good_mass), '落在理想结果上', '统计起伏 ±' + pct(M.stat_noise / 2));
    if (M.readout_only_estimate != null) heroStat(pct(M.readout_only_estimate), '只算读出误差的估计', '来自当次校准数据');
  }

  var ul = $('#summary');
  (D.summary || []).forEach(function (s) { h('li', null, s, ul); });

  }

  // ── 画图工具 ─────────────────────────────────────────
  function frame(host, H) {
    host.innerHTML = '';
    var W = Math.max(240, host.clientWidth);
    var svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, role: 'img' }, host);
    return { svg: svg, W: W, H: H };
  }
  function lin(d0, d1, r0, r1) { return function (v) { return r0 + (v - d0) / (d1 - d0 || 1) * (r1 - r0); }; }
  function axisY(g, y, x0, x1, ticks, fmt) {
    ticks.forEach(function (t) {
      el('line', { x1: x0, x2: x1, y1: y(t), y2: y(t), 'class': 'grid' }, g);
      var tx = el('text', { x: x0 - 8, y: y(t) + 4, 'text-anchor': 'end', 'class': 'tick' }, g);
      tx.textContent = fmt(t);
    });
  }
  function legend(host, items) {
    var lg = h('div', 'legend', null, null);
    items.forEach(function (it) {
      var s = h('span', null, null, lg);
      h('i', 'sw ' + it.cls, null, s); s.appendChild(document.createTextNode(it.text));
    });
    host.parentNode.insertBefore(lg, host);
  }
  function piLabel(v) {
    var k = Math.round(v / Math.PI * 4);
    var map = { 0: '0', 1: 'π/4', 2: 'π/2', 3: '3π/4', 4: 'π', 5: '5π/4', 6: '3π/2', 7: '7π/4', 8: '2π' };
    return map[k] || v.toFixed(2);
  }

  // 分布柱状图：理想（空心框）对实测（实心）
  function bars(host, ideal, meas, counts, extra) {
    // extra：对比模式下的多组实测 [{dist, counts, cls, name}]；单次运行时为空
    var series = extra || [{ dist: meas, counts: counts, cls: 'meas', name: '实测' }];
    var all = Object.assign({}, ideal); series.forEach(function (sr) { Object.assign(all, sr.dist); });
    meas = {}; Object.keys(all).forEach(function (k) {
      meas[k] = Math.max.apply(null, series.map(function (sr) { return sr.dist[k] || 0; }));
    });
    var keys = Object.keys(all).sort();
    if (keys.length > 16) {
      keys.sort(function (a, b) { return (meas[b] || 0) + (ideal[b] || 0) - (meas[a] || 0) - (ideal[a] || 0); });
      keys = keys.slice(0, 16).sort();
    }
    var narrow = (host.clientWidth - 60) / keys.length < 34;
    var F = frame(host, narrow ? 330 : 300), g = F.svg, L = 48, R = 12, T = 14, B = narrow ? 64 : 34;
    var vmax = Math.max.apply(null, keys.map(function (k) { return Math.max(ideal[k] || 0, meas[k] || 0); }));
    vmax = Math.min(1, Math.ceil(vmax * 10 + 0.0001) / 10);
    var y = lin(0, vmax, F.H - B, T), band = (F.W - L - R) / keys.length;
    var ticks = []; for (var t = 0; t <= vmax + 1e-9; t += vmax > 0.5 ? 0.25 : 0.1) ticks.push(t);
    axisY(g, y, L, F.W - R, ticks, function (t) { return Math.round(t * 100) + '%'; });
    var nb = series.length + 1, bw = Math.min(36, band * 0.72 / nb);
    keys.forEach(function (k, i) {
      var cx = L + band * (i + 0.5), pi = ideal[k] || 0;
      var base = F.H - B, x0 = cx - nb * (bw + 2) / 2;
      if (pi > 0) el('rect', { x: x0, y: y(pi), width: bw, height: Math.max(0.5, base - y(pi)), rx: 3, 'class': 'ideal' }, g);
      series.forEach(function (sr, j) {
        var pm = sr.dist[k] || 0;
        if (pm > 0) el('rect', { x: x0 + (j + 1) * (bw + 2), y: y(pm), width: bw, height: Math.max(0.5, base - y(pm)), rx: 3, 'class': sr.cls }, g);
      });
      var lab = narrow
        ? el('text', { x: cx + 4, y: F.H - B + 10, 'text-anchor': 'end', transform: 'rotate(-90 ' + (cx + 4) + ' ' + (F.H - B + 10) + ')', 'class': 'tick mono' }, g)
        : el('text', { x: cx, y: F.H - 12, 'text-anchor': 'middle', 'class': 'tick mono' }, g);
      lab.textContent = k;
      var hit = el('rect', { x: cx - band / 2, y: T, width: band, height: base - T, 'class': 'hit' }, g);
      hover(hit, '<b class="mono">' + k + '</b><br>理想 ' + pct(pi) + series.map(function (sr) {
        return '<br>' + sr.name + ' ' + pct(sr.dist[k] || 0) + (sr.counts && sr.counts[k] != null ? '（' + sr.counts[k] + ' 次）' : '');
      }).join(''));
    });
    el('line', { x1: L, x2: F.W - R, y1: F.H - B, y2: F.H - B, 'class': 'axis' }, g);
  }

  // 折线 + 点：x 为角度
  function curve(host, opts) {
    var F = frame(host, 320), g = F.svg, L = 56, R = 16, T = 16, B = 36;
    var x = lin(opts.x0, opts.x1, L, F.W - R), y = lin(opts.y0, opts.y1, F.H - B, T);
    axisY(g, y, L, F.W - R, opts.yticks, opts.yfmt);
    opts.xticks.forEach(function (t) {
      var tx = el('text', { x: x(t), y: F.H - 12, 'text-anchor': 'middle', 'class': 'tick' }, g);
      tx.textContent = piLabel(t);
    });
    el('line', { x1: L, x2: F.W - R, y1: F.H - B, y2: F.H - B, 'class': 'axis' }, g);
    (opts.hlines || []).forEach(function (hl) {
      el('line', { x1: L, x2: F.W - R, y1: y(hl.v), y2: y(hl.v), 'class': hl.cls }, g);
      var tx = el('text', { x: F.W - R, y: y(hl.v) - 6, 'text-anchor': 'end', 'class': 'tick' }, g);
      tx.textContent = hl.text;
    });
    (opts.lines || []).forEach(function (ln) {
      var d = '';
      for (var i = 0; i <= 200; i++) {
        var xv = opts.x0 + (opts.x1 - opts.x0) * i / 200;
        d += (i ? 'L' : 'M') + x(xv).toFixed(1) + ',' + y(ln.f(xv)).toFixed(1);
      }
      el('path', { d: d, 'class': ln.cls }, g);
    });
    (opts.points || []).forEach(function (p) {
      el('circle', { cx: x(p.x), cy: y(p.y), r: 5, 'class': p.cls || 'dot' }, g);
      var hit = el('circle', { cx: x(p.x), cy: y(p.y), r: 14, 'class': 'hit' }, g);
      hover(hit, p.tip);
    });
  }

  function fitSin(xs, ys) {
    var n = xs.length; if (n < 3) return null;
    var A = [[0, 0, 0], [0, 0, 0], [0, 0, 0]], v = [0, 0, 0];
    xs.forEach(function (x, k) {
      var r = [1, Math.cos(x), Math.sin(x)];
      for (var i = 0; i < 3; i++) { v[i] += r[i] * ys[k]; for (var j = 0; j < 3; j++) A[i][j] += r[i] * r[j]; }
    });
    for (var i = 0; i < 3; i++) {
      for (var k = 0; k < 3; k++) if (k !== i) {
        var f = A[k][i] / A[i][i];
        for (var j = 0; j < 3; j++) A[k][j] -= f * A[i][j];
        v[k] -= f * v[i];
      }
    }
    var a = v[0] / A[0][0], b = v[1] / A[1][1], c = v[2] / A[2][2];
    return function (x) { return a + b * Math.cos(x) + c * Math.sin(x); };
  }

  // 热力图：QAOA 的 (γ, β) 网格
  function heat(host, grid) {
    var gs = Array.from(new Set(grid.map(function (g) { return g.gamma; }))).sort(function (a, b) { return a - b; });
    var bs = Array.from(new Set(grid.map(function (g) { return g.beta; }))).sort(function (a, b) { return a - b; });
    var F = frame(host, 320), g = F.svg, L = host.clientWidth < 500 ? 48 : 64, R = 8, T = 12, B = 40;
    var cw = (F.W - L - R) / bs.length, ch = (F.H - T - B) / gs.length;
    var cuts = grid.map(function (c) { return c.cut; }).concat(grid.map(function (c) { return c.ideal; }));
    var lo = Math.min.apply(null, cuts), hi = Math.max.apply(null, cuts);
    grid.forEach(function (c) {
      var i = gs.indexOf(c.gamma), j = bs.indexOf(c.beta);
      var t = Math.max(0, Math.min(1, (c.cut - lo) / (hi - lo)));
      var r = el('rect', { x: L + j * cw + 1, y: T + (gs.length - 1 - i) * ch + 1, width: cw - 2, height: ch - 2, rx: 4,
        'class': 'cell', style: 'fill-opacity:' + (0.12 + 0.88 * t).toFixed(3) }, g);
      var tx = el('text', { x: L + (j + 0.5) * cw, y: T + (gs.length - 1 - i + 0.5) * ch + 4, 'text-anchor': 'middle',
        'class': 'cell-label' + (t > 0.55 ? ' on-dark' : '') }, g);
      tx.textContent = c.cut.toFixed(2);
      hover(r, 'γ = ' + c.gamma.toFixed(3) + '，β = ' + c.beta.toFixed(3) + '<br>实测平均割值 <b>' + c.cut.toFixed(2) +
        '</b><br>理想 ' + c.ideal.toFixed(2) + '<br>测到最优分法 ' + pct(c.p_max));
      hover(tx, 'γ = ' + c.gamma.toFixed(3) + '，β = ' + c.beta.toFixed(3) + '<br>实测平均割值 <b>' + c.cut.toFixed(2) + '</b><br>理想 ' + c.ideal.toFixed(2));
    });
    gs.forEach(function (v, i) {
      var tx = el('text', { x: L - 8, y: T + (gs.length - 1 - i + 0.5) * ch + 4, 'text-anchor': 'end', 'class': 'tick' }, g);
      tx.textContent = 'γ ' + v.toFixed(2);
    });
    bs.forEach(function (v, j) {
      var tx = el('text', { x: L + (j + 0.5) * cw, y: F.H - 14, 'text-anchor': 'middle', 'class': 'tick' }, g);
      tx.textContent = 'β ' + v.toFixed(2);
    });
  }


  // ── 多次运行对比 ─────────────────────────────────────
  function compareMode() {
    var SC = ['s1', 's2', 's3'];
    var name = function (r) { return (/sim/.test(String(r.target)) ? '' : '真机 ') + (r.backend || r.target); };
    $('#title').textContent = (D.title || D.template) + '：对比';
    $('#eyebrow').textContent = RUNS.length + ' 次运行 · ' + RUNS.map(name).join(' / ');
    var hero = $('#hero');
    RUNS.forEach(function (r, i) {
      var m = r.metrics || {}, v, lab;
      if (r.kind === 'rotation') { v = m.contrast != null ? m.contrast.toFixed(2) : '—'; lab = '对比度（理想 1.00）'; }
      else if (r.kind === 'vqe') { v = m.fit ? m.fit.min.toFixed(4) : '—'; lab = '最低能量 Ha（精确 ' + m.exact.toFixed(4) + '）'; }
      else if (r.kind === 'qaoa') { v = m.best ? m.best.cut.toFixed(2) : '—'; lab = '最好平均割值（最优 4）'; }
      else { v = m.good_mass != null ? pct(m.good_mass) : (m.fidelity != null ? m.fidelity.toFixed(3) : '—'); lab = m.good_mass != null ? '落在理想结果上' : '与理想的相似度'; }
      var c = h('div', 'stat', null, hero);
      var t = h('div', 'stat-value', v, c); t.classList.add('c-' + SC[i % 3]);
      h('div', 'stat-label', lab, c);
      var sub = h('div', 'stat-sub', null, c); h('i', 'sw sw-' + SC[i % 3], null, sub); sub.appendChild(document.createTextNode(' ' + name(r)));
    });
    var ul = $('#summary');
    RUNS.forEach(function (r) {
      var li = h('li', null, null, ul); h('b', null, name(r) + '：', li);
      li.appendChild(document.createTextNode((r.summary || []).slice(0, 3).join(' ')));
    });
    var dl = $('#meta');
    RUNS.forEach(function (r) {
      h('dt', null, name(r), dl);
      h('dd', null, (r.job_id || '') + ' · ' + (r.shots || '') + ' 次 · ' + (r.finished_at || '').replace('T', ' ').slice(0, 16), dl);
    });
    var main = $('#chart');
    var items = RUNS.map(function (r) { return (r.items || []).filter(function (it) { return it.measured && Object.keys(it.measured).length; }); });
    var leg = [{ cls: 'sw-ideal', text: '理想' }].concat(RUNS.map(function (r, i) { return { cls: 'sw-' + SC[i % 3], text: name(r) }; }));
    function drawCmp() {
      hideTip();
      var k = D.kind;
      if (k === 'rotation' || k === 'vqe') {
        var lines = [], pts = [], ys = [];
        RUNS.forEach(function (r, i) {
          var m = r.metrics || {}, P = k === 'rotation' ? (m.points || []).map(function (p) { return { x: p.theta, y: p.p1, i: p.ideal }; })
            : (m.curve || []).map(function (p) { return { x: p.theta, y: p.energy, i: p.ideal }; });
          var f = fitSin(P.map(function (p) { return p.x; }), P.map(function (p) { return p.y; }));
          if (f) lines.push({ cls: 'line-' + SC[i % 3], f: f });
          if (i === 0) { var fi = fitSin(P.map(function (p) { return p.x; }), P.map(function (p) { return p.i; })); if (fi) lines.unshift({ cls: 'line-ideal', f: fi }); }
          P.forEach(function (p) { ys.push(p.y, p.i); pts.push({ x: p.x, y: p.y, cls: 'dot-' + SC[i % 3], tip: name(r) + '<br>θ = ' + p.x.toFixed(2) + '<br>实测 ' + (k === 'rotation' ? pct(p.y) : p.y.toFixed(4) + ' Ha') + '<br>理想 ' + (k === 'rotation' ? pct(p.i) : p.i.toFixed(4) + ' Ha') }); });
        });
        if (k === 'rotation') {
          $('#chart-title').textContent = '转的角度 θ 与测到 1 的概率';
          curve(main, { x0: 0, x1: Math.PI, y0: 0, y1: 1, yticks: [0, .25, .5, .75, 1], yfmt: function (t) { return Math.round(t * 100) + '%'; },
            xticks: [0, Math.PI / 4, Math.PI / 2, 3 * Math.PI / 4, Math.PI], lines: lines, points: pts });
        } else {
          var ex = D.metrics.exact, y0 = Math.floor(Math.min.apply(null, ys.concat([ex])) * 5) / 5, y1 = Math.ceil(Math.max.apply(null, ys) * 5) / 5, tk = [];
          for (var t = y0; t <= y1 + 1e-9; t += 0.2) tk.push(t);
          $('#chart-title').textContent = '试探态角度 θ 与氢分子能量';
          curve(main, { x0: 0, x1: 2 * Math.PI, y0: y0, y1: y1, yticks: tk, yfmt: function (t) { return (Math.abs(t) < 1e-9 ? 0 : t).toFixed(1); },
            xticks: [0, Math.PI / 2, Math.PI, 3 * Math.PI / 2, 2 * Math.PI], hlines: [{ v: ex, cls: 'line-exact', text: '精确基态 ' + ex.toFixed(4) + ' Ha' }],
            lines: lines, points: pts });
        }
      } else if (k === 'qaoa') {
        $('#chart-title').textContent = '最好那组角度下，每种分法出现的概率';
        var bests = RUNS.map(function (r, i) {
          var b = r.metrics.best; return items[i].filter(function (it) { return it.label.gamma === b.gamma && it.label.beta === b.beta; })[0];
        });
        bars(main, bests[0].ideal, null, null, bests.map(function (it, i) { return { dist: it.measured, counts: it.counts, cls: SC[i % 3], name: name(RUNS[i]) }; }));
      } else {
        $('#chart-title').textContent = '每种结果出现的概率：理想 vs 各次实测';
        bars(main, items[0][0].ideal || {}, null, null, items.map(function (its, i) { return { dist: its[0].measured, counts: its[0].counts, cls: SC[i % 3], name: name(RUNS[i]) }; }));
      }
    }
    legend(main, D.kind === 'rotation' || D.kind === 'vqe' ? [{ cls: 'sw-ideal-line', text: '理想' }].concat(leg.slice(1)) : leg);
    drawCmp();
    var rt; addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(drawCmp, 120); });
    var raw = $('#raw'); if (raw) raw.closest('details').hidden = true;
  }
  if (RUNS) { compareMode(); return; }

  // ── 按类型出图 ───────────────────────────────────────
  var main = $('#chart'), second = $('#chart2');
  function draw() {
    hideTip();
    var items = (D.items || []).filter(function (it) { return it.measured && Object.keys(it.measured).length; });
    if (!items.length) { main.textContent = '没有成功的线路。'; return; }
    if (D.kind === 'rotation') {
      $('#chart-title').textContent = '转的角度 θ 与测到 1 的概率';
      curve(main, { x0: 0, x1: Math.PI, y0: 0, y1: 1, yticks: [0, .25, .5, .75, 1],
        yfmt: function (t) { return Math.round(t * 100) + '%'; }, xticks: [0, Math.PI / 4, Math.PI / 2, 3 * Math.PI / 4, Math.PI],
        lines: [{ cls: 'line-ideal', f: function (t) { return Math.pow(Math.sin(t / 2), 2); } },
                { cls: 'line-fit', f: function (t) { return M.offset - (M.contrast / 2) * Math.cos(t); } }],
        points: (M.points || []).map(function (p) {
          return { x: p.theta, y: p.p1, tip: 'θ = ' + piLabel(p.theta) + '<br>实测 ' + pct(p.p1) + '<br>理想 ' + pct(p.ideal) };
        }) });
    } else if (D.kind === 'vqe') {
      $('#chart-title').textContent = '试探态角度 θ 与氢分子能量';
      var cv = M.curve || [], ys = cv.map(function (p) { return p.energy; }).concat(cv.map(function (p) { return p.ideal; }));
      var fi = fitSin(cv.map(function (p) { return p.theta; }), cv.map(function (p) { return p.ideal; }));
      var fm = fitSin(cv.map(function (p) { return p.theta; }), cv.map(function (p) { return p.energy; }));
      for (var s = 0; s <= 64; s++) { var xv = 2 * Math.PI * s / 64; if (fi) ys.push(fi(xv)); if (fm) ys.push(fm(xv)); }
      var y0 = Math.floor(Math.min.apply(null, ys.concat([M.exact])) * 5) / 5, y1 = Math.ceil(Math.max.apply(null, ys) * 5) / 5;
      var tk = []; for (var t = y0; t <= y1 + 1e-9; t += 0.2) tk.push(t);
      curve(main, { x0: 0, x1: 2 * Math.PI, y0: y0, y1: y1, yticks: tk, yfmt: function (t) { return (Math.abs(t) < 1e-9 ? 0 : t).toFixed(1); },
        xticks: [0, Math.PI / 2, Math.PI, 3 * Math.PI / 2, 2 * Math.PI],
        hlines: [{ v: M.exact, cls: 'line-exact', text: '精确基态 ' + M.exact.toFixed(4) + ' Ha' }],
        lines: [fi && { cls: 'line-ideal', f: fi }, fm && { cls: 'line-fit', f: fm }].filter(Boolean),
        points: cv.map(function (p) {
          return { x: p.theta, y: p.energy, tip: 'θ = ' + p.theta.toFixed(2) + '<br>实测能量 ' + p.energy.toFixed(4) + ' Ha<br>理想 ' + p.ideal.toFixed(4) + ' Ha' };
        }) });
    } else if (D.kind === 'qaoa') {
      $('#chart-title').textContent = '每组角度 (γ, β) 下的平均割值';
      heat(main, M.grid || []);
      var b = M.best, best = items.filter(function (it) { return it.label.gamma === b.gamma && it.label.beta === b.beta; })[0];
      if (best && second) {
        second.parentNode.hidden = false;
        $('#chart2-title').textContent = '最好那组角度下，每种分法出现的概率';
        bars(second, best.ideal, best.measured, best.counts);
      }
    } else {
      $('#chart-title').textContent = '每种结果出现的概率：理想 vs 实测';
      bars(main, items[0].ideal || {}, items[0].measured, items[0].counts);
    }
  }
  var legends = { rotation: [{ cls: 'sw-ideal-line', text: '理想 sin²(θ/2)' }, { cls: 'sw-dot', text: '实测' }, { cls: 'sw-fit', text: '实测拟合' }],
    vqe: [{ cls: 'sw-ideal-line', text: '理想' }, { cls: 'sw-dot', text: '实测' }, { cls: 'sw-fit', text: '实测拟合' }, { cls: 'sw-exact', text: '精确基态' }],
    qaoa: [{ cls: 'sw-cell', text: '颜色越深，平均割值越大' }] };
  legend(main, legends[D.kind] || [{ cls: 'sw-ideal', text: '理想' }, { cls: 'sw-meas', text: '实测' }]);
  if (D.kind === 'qaoa' && second) legend(second, [{ cls: 'sw-ideal', text: '理想' }, { cls: 'sw-meas', text: '实测' }]);

  // ── 读出数据与线路 ───────────────────────────────────
  var ro = D.readout || {}, rk = Object.keys(ro);
  if (rk.length && $('#readout')) {
    $('#readout').hidden = false;
    var tb = $('#readout tbody');
    rk.sort().forEach(function (c) {
      var r = ro[c], tr = h('tr', null, null, tb);
      ['c[' + c + ']', 'Q' + r.physical_qubit, r.f0 != null ? pct(r.f0) : '—', r.f1 != null ? pct(r.f1) : '—',
       r.t1_us != null ? r.t1_us + ' μs' : '—', r.t2_us != null ? r.t2_us + ' μs' : '—'].forEach(function (v) { h('td', null, v, tr); });
    });
  }
  var first = (D.items || [])[0];
  if (first && $('#raw')) {
    $('#raw').textContent = JSON.stringify(first.counts || {}, null, 1);
  }

  draw();
  var rt; addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(draw, 120); });
})();

</script>
</body>
</html>
